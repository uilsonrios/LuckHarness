name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Confere que a tag bate com core.__version__
        shell: bash
        run: |
          v=$(python -c "import core; print(core.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != versão $v"; exit 1; }
          echo "VER=$v" >> $GITHUB_ENV
      - run: pyinstaller luckHarness.spec --noconfirm
      - run: choco install innosetup -y --no-progress
      - run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q "/DAppVer=$env:VER" installer.iss'
      - name: Publica o release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/luckHarness-Setup.exe dist/luckHarness.exe --title "LuckHarness $VER" --generate-notes
